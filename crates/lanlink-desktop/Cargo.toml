[package]
name = "lanlink-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

description = "Native desktop GUI for LanLink (Tauri)"

[[bin]]
name = "lanlink-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde.workspace = true
serde_json = "1"
# Windows status-socket discovery reads the daemon config's [status] table.
toml.workspace = true
tokio.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
reqwest.workspace = true
rand.workspace = true
lanlink-proto = { path = "../lanlink-proto" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
open = "5.4.4"

[features]
# Enable Tauri's devtools only in debug builds via the workspace's default dev profile.
default = []
