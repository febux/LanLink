name: E2E

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  integration:
    name: Integration tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run rootless integration tests
        run: make integration-test

  e2e:
    name: End-to-end scenarios
    # This job requires a privileged self-hosted runner (netns/TAP need
    # CAP_NET_ADMIN). Configure the runner label in the E2E_RUNNER repository
    # variable; the job is skipped until that variable is set.
    if: github.repository == 'febux/LanLink' && vars.E2E_RUNNER != ''
    runs-on: ${{ vars.E2E_RUNNER }}
    needs: integration
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install network tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y iproute2 iptables nftables net-tools iputils-ping
      - name: Build release binaries
        run: make e2e-build
      - name: Run e2e scenarios
        run: sudo -E make e2e
