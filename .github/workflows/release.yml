name: Release

on:
  push:
    branches: [master, main]
    tags:
      - "v*"
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-deb:
    name: Build .deb (Ubuntu)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install Debian packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev fakeroot
      - name: Build .deb
        run: |
          cargo fetch
          fakeroot bash dist/deb/build-deb.sh
      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: lanlink-deb
          path: dist/deb/out/*.deb
          if-no-files-found: error

  build-rpm:
    name: Build .rpm (Fedora)
    runs-on: ubuntu-24.04
    container:
      image: fedora:latest
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          dnf install -y rpm-build cargo git nftables iproute systemd-rpm-macros
      - name: Build .rpm
        run: |
          set -x
          bash dist/rpm/build-rpm.sh
      - name: Upload .rpm artifact
        uses: actions/upload-artifact@v4
        with:
          name: lanlink-rpm
          path: dist/rpm/out/*.rpm
          if-no-files-found: error

  build-msi:
    name: Build .msi (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install WiX
        run: dotnet tool install --global wix
      - name: Build .msi
        shell: bash
        env:
          WIX_EULA_ID: wix7
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"
          bash dist/windows/build-msi.sh
      - name: Upload .msi artifact
        uses: actions/upload-artifact@v4
        with:
          name: lanlink-msi
          path: dist/windows/out/*.msi
          if-no-files-found: error

  build-pkg:
    name: Build .pkg (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Build .pkg
        run: bash dist/macos/build-pkg.sh
      - name: Upload .pkg artifact
        uses: actions/upload-artifact@v4
        with:
          name: lanlink-pkg
          path: dist/macos/out/*.pkg
          if-no-files-found: error

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-deb, build-rpm, build-msi, build-pkg]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Flatten artifacts for upload
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.msi' -o -name '*.pkg' \) -exec cp {} release/ \;
          ls -la release/
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
