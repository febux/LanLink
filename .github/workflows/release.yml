name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  build-deb:
    name: Build .deb (Ubuntu)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install Debian packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev fakeroot libwebkit2gtk-4.1-dev
      - name: Build .deb with desktop GUI
        run: |
          cargo fetch
          fakeroot bash dist/deb/build-deb.sh --with-gui
      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: lanlink-deb
          path: dist/deb/out/*.deb
          if-no-files-found: error

  build-rpm:
    name: Build .rpm (Fedora)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    container:
      image: fedora:latest
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          dnf install -y rpm-build cargo git nftables iproute systemd-rpm-macros webkit2gtk4.1-devel
      - name: Build .rpm
        run: |
          set -x
          bash dist/rpm/build-rpm.sh
      - name: Upload .rpm artifact
        uses: actions/upload-artifact@v4
        with:
          name: lanlink-rpm
          path: dist/rpm/out/*.rpm
          if-no-files-found: error

  build-msi:
    name: Build .msi (Windows)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install WiX
        run: dotnet tool install --global wix
      - name: Build .msi with desktop GUI
        shell: bash
        env:
          WIX_EULA_ID: wix7
          LL_GUI: all
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"
          bash dist/windows/build-msi.sh
      - name: Upload .msi artifact
        uses: actions/upload-artifact@v4
        with:
          name: lanlink-msi
          path: dist/windows/out/*.msi
          if-no-files-found: error

  build-pkg:
    name: Build .pkg (macOS)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Build .pkg
        run: bash dist/macos/build-pkg.sh
      - name: Upload .pkg artifact
        uses: actions/upload-artifact@v4
        with:
          name: lanlink-pkg
          path: dist/macos/out/*.pkg
          if-no-files-found: error

  build-appimage:
    name: Build AppImage
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install tauri-cli
        run: cargo install tauri-cli --locked
      - name: Build AppImage
        run: bash dist/appimage/build-appimage.sh
      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: lanlink-appimage
          path: dist/appimage/out/*.AppImage
          if-no-files-found: error

  build-tarball:
    name: Build portable Linux tarball
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev
      - name: Build portable tarball with all GUI front-ends
        run: bash dist/tarball/build-tarball.sh
      - name: Upload tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: lanlink-tarball
          path: dist/tarball/out/*.tar.gz
          if-no-files-found: error

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-deb, build-rpm, build-msi, build-pkg, build-appimage, build-tarball]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Flatten artifacts for upload
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.msi' -o -name '*.pkg' -o -name '*.AppImage' -o -name '*.tar.gz' \) -exec cp {} release/ \;
          ls -la release/
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
