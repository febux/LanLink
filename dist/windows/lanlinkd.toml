# LanLink daemon configuration (Windows service).
#
# This file is read by the LanLinkDaemon service from:
#   C:\Program Files\LanLink\lanlinkd.toml
#
# The installer writes it only once: editing it here is safe, upgrades and
# repairs will NOT overwrite your changes. After editing, restart the
# service:  sc stop LanLinkDaemon && sc start LanLinkDaemon
#
# Secrets: prefer `password_file` over `password`; the file should contain
# the password on its first line.

[network]
# Coordinator base URL.
coordinator = "http://localhost:8080"

# Network id (as shown by `lanlinkctl coord create`).
network_id = 1

# Either `password` or `password_file` is required.
#password = "change-me"
password_file = '''C:\Program Files\LanLink\network.secret'''

# UDP socket to listen on; also advertised to peers as a direct candidate.
bind = "0.0.0.0:9000"

# Virtual NIC name (must be unique per network on this node).
tap = "lanlink0"

# Virtual NIC MTU. 1400 leaves headroom for encryption + outer UDP/IP.
mtu = 1400

[status]
# Read-only status endpoint for the desktop/TUI/Web frontends. On Windows
# this is a TCP loopback address; the desktop app discovers it automatically.
# Keep the port aligned with `network_id` above: default is 9000 + network_id.
socket = "127.0.0.1:9001"

# STUN servers used for NAT discovery. Empty = built-in defaults.
stun_servers = []

[gateway]
# Set to true to share this node's physical LAN with the virtual network.
enabled = false
# Required when enabled, e.g. "192.168.1.0/24".
shared_subnet = "192.168.1.0/24"
# Required when enabled: the interface that reaches the shared subnet.
phys_interface = "eth0"

[telemetry]
# Opt-in anonymized telemetry. Disabled by default.
enabled = false
# endpoint = "https://coord.example.com:8080/telemetry"
# interval_hours = 24
